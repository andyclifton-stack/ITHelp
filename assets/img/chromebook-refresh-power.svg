<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Chromebook refresh and power reset</title>
  <desc id="desc">Hold the Refresh key, tap the Power button once, then release Refresh when the screen lights up.</desc>
  <rect width="980" height="520" rx="28" fill="#f5f7fb"/>
  <rect x="85" y="54" width="810" height="250" rx="18" fill="#000b4d"/>
  <rect x="122" y="88" width="736" height="182" rx="10" fill="#e5f9ff"/>
  <path d="M490 137a42 42 0 1 1-30 12" fill="none" stroke="#00b3e8" stroke-width="17" stroke-linecap="round"/>
  <path d="M457 126l51 3-29 43z" fill="#00b3e8"/>
  <rect x="52" y="318" width="876" height="134" rx="16" fill="#fff" stroke="#d9e0ea" stroke-width="3"/>
  <rect x="90" y="350" width="154" height="70" rx="9" fill="#fff0e6" stroke="#ed6b17" stroke-width="4"/>
  <path d="M161 374a18 18 0 1 1-13 5" fill="none" stroke="#000b4d" stroke-width="7" stroke-linecap="round"/>
  <path d="M148 369l28 2-16 23z" fill="#000b4d"/>
  <text x="167" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#000b4d">Hold Refresh</text>
  <rect x="730" y="350" width="106" height="70" rx="35" fill="#e5f9ff" stroke="#00b3e8" stroke-width="4"/>
  <path d="M783 367v23" stroke="#000b4d" stroke-width="7" stroke-linecap="round"/>
  <path d="M769 379a19 19 0 1 0 28 0" fill="none" stroke="#000b4d" stroke-width="7" stroke-linecap="round"/>
  <text x="783" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#000b4d">Tap Power</text>
  <path d="M284 385h390" stroke="#283583" stroke-width="8" stroke-linecap="round"/>
  <path d="M654 362l43 23-43 23z" fill="#283583"/>
  <text x="489" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#526071">then release when the screen lights up</text>
</svg>
